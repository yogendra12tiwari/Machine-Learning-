<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FWI Prediction</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --forest: #0f2b1d;
      --moss: #1f5d3a;
      --ember: #ff6a1a;
      --flame: #ff3d3d;
      --gold: #ffc53d;
      --paper: #fffaf2;
      --ink: #1c1c1c;
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 16px;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 85%, rgba(255,106,26,.55), transparent 45%),
        radial-gradient(circle at 85% 10%, rgba(255,197,61,.35), transparent 40%),
        linear-gradient(160deg, var(--forest), var(--moss));
      background-attachment: fixed;
    }
    .login {
      width: 100%;
      max-width: 760px;
      background: var(--paper);
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 30px 80px rgba(0,0,0,.45);
    }
    .hero {
      padding: 40px 40px 32px;
      color: #fff;
      background: linear-gradient(120deg, var(--flame), var(--ember) 55%, var(--gold));
      position: relative;
    }
    .hero::after {
      content: "";
      position: absolute; inset: auto 0 -1px 0; height: 28px;
      background: var(--paper);
      clip-path: polygon(0 100%, 6% 30%, 12% 80%, 20% 20%, 28% 75%, 36% 15%, 45% 70%, 54% 25%, 63% 80%, 72% 20%, 81% 70%, 90% 30%, 100% 80%, 100% 100%);
    }
    h1 {
      font-family: 'Fraunces', serif;
      font-weight: 900;
      font-size: clamp(2.2rem, 6vw, 3.4rem);
      line-height: 1.05;
    }
    .hero p { margin-top: 10px; max-width: 46ch; opacity: .95; font-size: 1.05rem; }
    form { padding: 28px 40px 40px; }
    fieldset { border: 0; padding: 0; margin: 0 0 24px; }
    legend {
      font-family: 'Fraunces', serif;
      font-weight: 700;
      font-size: 1.15rem;
      color: var(--moss);
      margin-bottom: 14px;
    }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
    label { display: block; font-size: .85rem; font-weight: 600; margin-bottom: 6px; color: #444; }
    label small { font-weight: 400; color: #888; }
    input, select {
      width: 100%;
      font: inherit;
      padding: 12px 14px;
      border: 2px solid #eadfcf;
      border-radius: 12px;
      background: #fff;
      transition: border-color .15s, box-shadow .15s;
    }
    input:focus, select:focus {
      outline: none;
      border-color: var(--ember);
      box-shadow: 0 0 0 4px rgba(255,106,26,.2);
    }
    .btn {
      width: 100%;
      margin-top: 8px;
      padding: 16px;
      border: 0;
      border-radius: 14px;
      font: 600 1.1rem 'Outfit', sans-serif;
      color: #fff;
      cursor: pointer;
      background: linear-gradient(120deg, var(--moss), #2e8b57);
      box-shadow: 0 10px 24px rgba(31,93,58,.4);
      transition: transform .15s, box-shadow .15s, background .3s;
    }
    .btn:hover { transform: translateY(-2px); background: linear-gradient(120deg, var(--flame), var(--ember)); box-shadow: 0 14px 28px rgba(255,61,61,.35); }
    .btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
    .result {
      margin: 0 40px 40px;
      padding: 22px 26px;
      border-radius: 18px;
      background: var(--forest);
      color: #fff;
      display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
      border-left: 8px solid var(--ember);
    }
    .result h2 { font-family: 'Outfit', sans-serif; font-weight: 500; font-size: 1.2rem; }
    .result strong { font-family: 'Fraunces', serif; font-size: 2.6rem; color: var(--gold); }
    @media (max-width: 520px) { .hero, form { padding-left: 22px; padding-right: 22px; } .result { margin: 0 22px 28px; } }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <div class="login">
    <div class="hero">
      <h1>FWI Prediction</h1>
      <p>Enter today's weather and fuel moisture readings to estimate the Fire Weather Index.</p>
    </div>

    <!-- Main Input For Receiving Query to our ML -->
    <form action="{{ url_for('predict_datapoint') }}" method="post">
      <fieldset>
        <legend>Weather</legend>
        <div class="grid">
          <div><label for="Temperature">Temperature <small>(°C)</small></label>
            <input type="number" step="any" id="Temperature" name="Temperature" placeholder="e.g. 29" required></div>
          <div><label for="RH">Relative humidity <small>(%)</small></label>
            <input type="number" step="any" id="RH" name="RH" placeholder="e.g. 57" required></div>
          <div><label for="Ws">Wind speed <small>(km/h)</small></label>
            <input type="number" step="any" id="Ws" name="Ws" placeholder="e.g. 18" required></div>
          <div><label for="Rain">Rain <small>(mm)</small></label>
            <input type="number" step="any" id="Rain" name="Rain" placeholder="e.g. 0" required></div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Fuel moisture indices</legend>
        <div class="grid">
          <div><label for="FFMC">FFMC</label>
            <input type="number" step="any" id="FFMC" name="FFMC" placeholder="e.g. 65.7" required></div>
          <div><label for="DMC">DMC</label>
            <input type="number" step="any" id="DMC" name="DMC" placeholder="e.g. 3.4" required></div>
          <div><label for="ISI">ISI</label>
            <input type="number" step="any" id="ISI" name="ISI" placeholder="e.g. 1.3" required></div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Context</legend>
        <div class="grid">
          <div><label for="Classes">Fire class</label>
            <select id="Classes" name="Classes" required>
              <option value="" disabled selected>Select class</option>
              <option value="0">Not fire (0)</option>
              <option value="1">Fire (1)</option>
            </select></div>
          <div><label for="Region">Region</label>
            <select id="Region" name="Region" required>
              <option value="" disabled selected>Select region</option>
              <option value="0">Bejaia (0)</option>
              <option value="1">Sidi Bel-abbes (1)</option>
            </select></div>
        </div>
      </fieldset>

      <button type="submit" class="btn btn-primary btn-block btn-large">Predict</button>
    </form>

    {% if result is defined %}
    <div class="result">
      <h2>THE FWI prediction is <strong>{{result}}</strong></h2>
    </div>
    {% endif %}
  </div>
</body>
</html>
